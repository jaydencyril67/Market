name: Build CryBots Brain

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: crybots-brain-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Brain
        run: npm run build

      - name: Commit dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "dist is already up to date"
            exit 0
          fi
          git commit -m "build: publish Brain dist"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push raced with another update; rebasing and rebuilding (attempt $attempt)"
            git fetch origin main
            git rebase origin/main
            npm run build
            git add dist
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
          done
          echo "Could not publish dist after three attempts"
          exit 1
